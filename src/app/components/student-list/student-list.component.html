<div class="heading">
  <h2>Students</h2>
  <span class="count">{{ students.length }} total</span>
</div>

<div class="toolbar">
  <input type="search" placeholder="Search by name" [(ngModel)]="searchText" />
  <select [(ngModel)]="selectedCourse">
    <option value="">All courses</option>
    @for (c of courses; track c) {
      <option [value]="c">{{ c }}</option>
    }
  </select>
</div>

@if (filteredStudents.length === 0) {
  <p class="empty">No students found. Clear the search or choose All courses.</p>
} @else {
  <div class="grid">
    @for (s of filteredStudents; track s.id) {
      <app-student-card [student]="s" (delete)="onDelete($event)"></app-student-card>
    }
  </div>
}
